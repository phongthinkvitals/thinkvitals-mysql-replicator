app.name=${APP_NAME:thinkvitals-mysql-binlog-replicator}

  # Source MySQL
source.url=${SOURCE_URL:jdbc:mysql://localhost:3309/thinkvitals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
source.username=${SOURCE_USERNAME:root}
source.password=${SOURCE_PASSWORD:password}

  # Sink MySQL
sink.url=${SINK_URL:jdbc:mysql://localhost:3310/thinkvitals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
sink.username=${SINK_USERNAME:root}
sink.password=${SINK_PASSWORD:password}

  # Replication
replication.server-id=${REPLICATION_SERVER_ID:987654}
replication.auto-start=${REPLICATION_AUTO_START:false}
replication.use-gtid=${REPLICATION_USE_GTID:true}
replication.snapshot-mode=${REPLICATION_SNAPSHOT_MODE:initial}
replication.ddl-enabled=${REPLICATION_DDL_ENABLED:true}

  # false = relaxed sink DDL: keep columns and primary key, skip FK/unique/index/check constraints.
  # true = strict sink DDL: apply source DDL as-is after source/sink schema mapping.
replication.strict-ddl=${REPLICATION_STRICT_DDL:true}

replication.dml-enabled=${REPLICATION_DML_ENABLED:true}

  # Empty list
replication.include-tables=${REPLICATION_INCLUDE_TABLES:}

  # Comma-separated list
replication.exclude-tables=${REPLICATION_EXCLUDE_TABLES:flyway_schema_history,replication_checkpoint}

replication.on-duplicate-insert=${REPLICATION_ON_DUPLICATE_INSERT:upsert}
replication.require-primary-key=${REPLICATION_REQUIRE_PRIMARY_KEY:true}

  # Retry
retry.max-attempts=${RETRY_MAX_ATTEMPTS:5}
retry.backoff-ms=${RETRY_BACKOFF_MS:3000}

  # Monitoring / Server
monitoring.port=${MONITORING_PORT:8080}
server.port=${SERVER_PORT:${monitoring.port}}

  # Spring Security
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin123}

  # Logging
logging.level.com.example.replicator=${LOG_LEVEL_REPLICATOR:INFO}