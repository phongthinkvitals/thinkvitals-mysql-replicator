services:
  source-mysql:
    image: mysql:9.6.0
    command:
      - --server-id=101
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: thinkvitals
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  sink-mysql:
    image: mysql:9.6.0
    command:
      - --server-id=202
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: thinkvitals
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  replicator:
    build: .
    depends_on:
      source-mysql:
        condition: service_healthy
      sink-mysql:
        condition: service_healthy
    environment:
      SOURCE_URL: jdbc:mysql://source-mysql:3309/thinkvitals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SOURCE_USERNAME: root
      SOURCE_PASSWORD: password
      SINK_URL: jdbc:mysql://sink-mysql:3310/thinkvitals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SINK_USERNAME: root
      SINK_PASSWORD: password
    ports:
      - "8080:8080"
