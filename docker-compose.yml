services:
  source-mysql:
    image: mysql:9.6.0
    command:
      - --server-id=101
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: thinkvitals
    volumes:
      - replicator-source:/var/lib/mysql
      - ./backend/docker/mysql/source:/docker-entrypoint-initdb.d:ro
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 30

  sink-mysql:
    image: mysql:9.6.0
    command:
      - --server-id=202
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: thinkvitals
    volumes:
      - replicator-sink:/var/lib/mysql
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 30

